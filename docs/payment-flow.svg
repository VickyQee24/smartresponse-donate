<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Payment flow: card via Paystack or bank transfer, both ending at the thank-you page">
  <defs>
    <style>
      .box  { fill:#fff; stroke:#e8e8ec; stroke-width:1.5; rx:12; }
      .pink { fill:#fff4f9; stroke:#f0aecd; }
      .t    { font-family:Segoe UI, Helvetica, Arial, sans-serif; fill:#1c1c1e; }
      .h    { font-size:14px; font-weight:700; }
      .s    { font-size:11.5px; fill:#767680; }
      .lbl  { font-size:11px; font-weight:700; fill:#e51b87; }
      .flow { stroke:#e51b87; stroke-width:2; fill:none; marker-end:url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e51b87"/>
    </marker>
  </defs>

  <rect width="900" height="330" fill="#ffffff"/>

  <!-- start -->
  <rect class="box pink" x="24" y="126" width="170" height="78"/>
  <text class="t h" x="44" y="158">Donate / Shop</text>
  <text class="t s" x="44" y="178">Amount + details</text>

  <path class="flow" d="M198 152 H 268"/>
  <path class="flow" d="M198 178 H 268"/>

  <!-- card branch -->
  <rect class="box" x="272" y="60" width="200" height="86"/>
  <text class="t h" x="292" y="92">1 · Pay with card</text>
  <text class="t s" x="292" y="112">Paystack Inline</text>
  <text class="t s" x="292" y="130">public key only</text>

  <!-- transfer branch -->
  <rect class="box" x="272" y="186" width="200" height="100"/>
  <text class="t h" x="292" y="216">2 · Bank transfer</text>
  <text class="t s" x="292" y="236">GTBank · 4 currencies</text>
  <text class="t s" x="292" y="254">“I have sent the amount”</text>
  <text class="t s" x="292" y="272">order emailed to us</text>

  <path class="flow" d="M476 103 H 556"/>
  <path class="flow" d="M476 236 H 556"/>

  <!-- middle -->
  <rect class="box" x="560" y="60" width="150" height="86"/>
  <text class="t h" x="580" y="98">Paystack</text>
  <text class="t s" x="580" y="118">charges card</text>

  <rect class="box" x="560" y="196" width="150" height="80"/>
  <text class="t h" x="580" y="232">Web3Forms</text>
  <text class="t s" x="580" y="252">emails the order</text>

  <path class="flow" d="M714 103 C 760 103 760 150 790 150"/>
  <path class="flow" d="M714 236 C 760 236 760 190 790 190"/>

  <!-- end -->
  <rect class="box pink" x="794" y="130" width="86" height="80"/>
  <text class="t h" x="812" y="164">Thank</text>
  <text class="t h" x="812" y="182">you</text>

  <text class="lbl" x="24" y="40">NO BACKEND · NO SERVER · NO SECRET KEYS IN THE BROWSER</text>
</svg>
