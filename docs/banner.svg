<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Smart Response Youth Foundation — Save the Dignity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e51b87"/>
      <stop offset="55%" stop-color="#b91e6d"/>
      <stop offset="100%" stop-color="#7b1955"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="clip">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- pulsing rings, echoing an emergency signal -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.30">
      <circle cx="1010" cy="150" r="40">
        <animate attributeName="r" values="40;120;40" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="150" r="40">
        <animate attributeName="r" values="40;120;40" dur="4s" begin="1.3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="150" r="40">
        <animate attributeName="r" values="40;120;40" dur="4s" begin="2.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- beating heart -->
    <g transform="translate(1010 150)">
      <path d="M0 22 C -26 2 -38 -12 -38 -26 A 19 19 0 0 1 0 -34 A 19 19 0 0 1 38 -26 C 38 -12 26 2 0 22 Z"
            fill="#ffffff" fill-opacity="0.95">
        <animateTransform attributeName="transform" type="scale"
                          values="1;1.12;1;1.06;1" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="72" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Smart Response Youth Foundation
    </text>

    <text x="74" y="176" font-family="Georgia, serif" font-size="30"
          font-style="italic" fill="#ffffff" fill-opacity="0.92">
      Save the Dignity.
    </text>

    <text x="74" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="17" fill="#ffffff" fill-opacity="0.72" letter-spacing="2.4">
      DONATE · SHOP · VOLUNTEER · 112 SMART RESPONSE APP
    </text>

    <rect x="74" y="248" width="0" height="4" rx="2" fill="#ffffff" fill-opacity="0.85">
      <animate attributeName="width" values="0;560;560" dur="2.4s" fill="freeze"/>
    </rect>

    <!-- sweeping highlight -->
    <rect x="-400" y="0" width="400" height="300" fill="url(#shine)">
      <animate attributeName="x" values="-400;1200" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
